<div class="d-flex flex-column min-vh-100">
  <header class="shadow-sm bg-white">
    <!-- Barra de Acessibilidade -->
    <div class="accessibility-bar bg-dark text-white px-3 d-flex justify-content-between align-items-center small">
      <div>
        <span class="d-none d-sm-inline"><i class="bi bi-universal-access me-2 text-warning"></i>Acessibilidade:</span>
      </div>
      <div class="d-flex gap-3 align-items-center">
        <!-- Ajustes de fonte -->
        <div class="btn-group btn-group-sm" role="group" aria-label="Ajuste de tamanho da fonte">
          <button (click)="accessibilityService.decreaseFont()" class="btn btn-dark text-white border-secondary btn-sm" title="Diminuir fonte">
            A-
          </button>
          <button (click)="accessibilityService.increaseFont()" class="btn btn-dark text-white border-secondary btn-sm" title="Aumentar fonte">
            A+
          </button>
        </div>
        <!-- Alto contraste -->
        <button (click)="accessibilityService.toggleHighContrast()" class="btn btn-sm btn-dark text-white border-secondary" title="Alternar Alto Contraste">
          <i class="bi bi-circle-half me-1"></i> Alto Contraste
        </button>
      </div>
    </div>

    <!-- Menu de Navegação -->
    <nav class="navbar navbar-compact navbar-expand-lg navbar-light bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary-color" routerLink="/home">
          <i class="bi bi-egg-fried fs-4"></i>
          <span>Substitutos Saudáveis</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center gap-2 mt-2 mt-lg-0">
            <li class="nav-item" *ngIf="authService.isLoggedIn()">
              <a class="nav-link px-3" routerLink="/home" routerLinkActive="active font-weight-bold text-primary-color" [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-house-door me-1"></i>Início
              </a>
            </li>
            <li class="nav-item" *ngIf="authService.isLoggedIn()">
              <a class="nav-link px-3" routerLink="/recipes" routerLinkActive="active font-weight-bold text-primary-color">
                <i class="bi bi-arrow-left-right me-1"></i>Substitutos
              </a>
            </li>
            <li class="nav-item" *ngIf="authService.isLoggedIn()">
              <a class="nav-link px-3" routerLink="/alternative-recipes" routerLinkActive="active font-weight-bold text-primary-color">
                <i class="bi bi-book-half me-1"></i>Receitas
              </a>
            </li>
            <li class="nav-item ms-lg-3" *ngIf="authService.isLoggedIn()">
              <button (click)="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                <i class="bi bi-box-arrow-right me-1"></i>Sair
              </button>
            </li>
            <li class="nav-item" *ngIf="!authService.isLoggedIn()">
              <a class="btn btn-custom-primary btn-sm px-4" routerLink="/login">
                Entrar
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Área de Conteúdo -->
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Rodapé -->
  <footer class="footer-compact bg-dark text-white mt-auto border-top border-secondary">
    <div class="container">
      <div class="row align-items-center">
        <!-- Redes Sociais no lado esquerdo -->
        <div class="col-md-4 text-center text-md-start mb-2 mb-md-0">
          <div class="d-flex gap-2 justify-content-center justify-content-md-start fs-5">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="text-white text-opacity-75 hover-opacity-100" title="Facebook">
              <i class="bi bi-facebook"></i>
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="text-white text-opacity-75 hover-opacity-100" title="YouTube">
              <i class="bi bi-youtube"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="text-white text-opacity-75 hover-opacity-100" title="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
          </div>
        </div>
        
        <!-- Créditos no centro -->
        <div class="col-md-4 text-center mb-2 mb-md-0">
          <p class="mb-0 fw-bold footer-title">Substitutos Saudáveis de Cozinha &copy; 2026</p>
          <p class="small text-muted mb-0 footer-subtitle">Acessibilidade digital e conformidade com a LGPD.</p>
        </div>
        
        <!-- ASBAI no lado direito -->
        <div class="col-md-4 text-center text-md-end">
          <a href="https://asbai.org.br/alergia-alimentar-4/" target="_blank" rel="noopener noreferrer" class="text-warning text-decoration-none fw-semibold small" title="Associação Brasileira de Alergia e Imunologia - Alergia Alimentar">
            <i class="bi bi-heart-pulse-fill me-1 text-danger"></i>Alergia Alimentar - ASBAI
          </a>
        </div>
      </div>
    </div>
  </footer>
</div>
